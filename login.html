<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Masuk — KisahKita</title>
  <link rel="stylesheet" href="assets/app.css" />
</head>
<body style="display:flex; min-height:100vh; align-items:center; justify-content:center; padding:20px;">
  <div class="card" style="max-width:420px; width:100%;">
    <div style="text-align:center; margin-bottom:20px;">
      <a href="index.html" class="brand" style="justify-content:center;">Kisah<span>Kita</span></a>
      <p style="color:var(--muted); font-size:0.9rem; margin-top:6px;">Masuk sebagai Pelanggan atau Admin</p>
    </div>

    <div id="alertBox" class="alert alert-error"></div>

    <form id="loginForm">
      <div class="form-group">
        <label>Email</label>
        <input type="email" id="email" class="form-control" placeholder="nama@email.com" required />
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••" required />
      </div>
      <button type="submit" id="submitBtn" class="btn btn-primary" style="width:100%; margin-top:6px;">Masuk</button>
    </form>

    <p style="text-align:center; font-size:0.88rem; color:var(--muted); margin-top:16px;">
      Belum punya akun pelanggan? <a href="register.html" style="color:var(--primary); font-weight:700;">Daftar Sekarang</a>
    </p>
    <p style="text-align:center; font-size:0.82rem; margin-top:8px;">
      <a href="index.html" style="color:var(--muted);">&larr; Kembali ke Katalog</a>
    </p>
  </div>

  <script src="config.js"></script>
  <script src="assets/api.js"></script>
  <script>
    const existing = KisahAPI.getSession();
    if (existing && existing.token) {
      window.location.href = existing.role === 'admin' ? 'admin.html' : 'dashboard.html';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const alertBox = document.getElementById('alertBox');
      alertBox.classList.remove('show');
      btn.disabled = true;
      btn.textContent = 'Memproses...';

      try {
        const res = await KisahAPI.post('login', {
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value
        });

        if (res.status === 'success' && res.data) {
          KisahAPI.setSession(res.data);
          if (res.data.role === 'admin') {
            window.location.href = 'admin.html';
          } else {
            const selectedTpl = sessionStorage.getItem('selected_template_id');
            window.location.href = selectedTpl
              ? 'dashboard.html?order=' + encodeURIComponent(selectedTpl)
              : 'dashboard.html';
          }
        } else {
          alertBox.textContent = res.message || 'Login gagal';
          alertBox.classList.add('show');
        }
      } catch (err) {
        alertBox.textContent = 'Terjadi kesalahan koneksi API.';
        alertBox.classList.add('show');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Masuk';
      }
    });
  </script>
</body>
</html>
