<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Undangan Pernikahan — KisahKita</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0f172a; font-family: sans-serif; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
    .state-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #fff;
      text-align: center;
      padding: 24px;
    }
  </style>
</head>
<body>
  <div id="stateBox" class="state-box">Memuat undangan...</div>
  <iframe id="tplFrame" style="display:none;"></iframe>

  <script src="config.js"></script>
  <script src="assets/api.js"></script>
  <script>
    (async function init() {
      const params = new URLSearchParams(window.location.search);
      const slug = params.get('slug') || 'demo-undangan';
      const tamu = params.get('tamu') || 'Bapak/Ibu/Saudara/i';
      const overrideTpl = params.get('tpl');

      const res = await KisahAPI.get({ action: 'getInvitation', slug });
      const stateBox = document.getElementById('stateBox');

      if (res.status !== 'success' || !res.data) {
        stateBox.innerHTML = `<h2>Undangan Belum Tersedia</h2><p style="margin-top:8px; opacity:0.8;">${res.message || 'Pastikan link undangan sudah benar.'}</p>`;
        return;
      }

      const folder = overrideTpl || res.data.folder_path || 'template-biru-marmer';
      const frame = document.getElementById('tplFrame');
      frame.src = `undangan-template/${folder}/index.html?slug=${encodeURIComponent(slug)}&tamu=${encodeURIComponent(tamu)}`;

      frame.onload = () => {
        stateBox.style.display = 'none';
        frame.style.display = 'block';
        frame.contentWindow.postMessage({
          type: 'KISAH_INVITATION_DATA',
          payload: {
            slug,
            tamu,
            invitation: res.data.invitation || {},
            ucapan: res.data.ucapan || []
          }
        }, '*');
      };

      // Terima pengiriman ucapan/RSVP dari dalam iframe template
      window.addEventListener('message', async (event) => {
        if (event.data && event.data.type === 'KISAH_SUBMIT_UCAPAN') {
          const submitRes = await KisahAPI.post('addUcapan', {
            slug_undangan: slug,
            ...event.data.payload
          });
          frame.contentWindow.postMessage({
            type: 'KISAH_UCAPAN_RESULT',
            payload: submitRes
          }, '*');
        }
      });
    })();
  </script>
</body>
</html>
